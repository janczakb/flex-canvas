<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Document examples</title>
  <link rel="stylesheet" href="/examples/example.css">
</head>
<body>
  <main class="example-grid">
    <article class="example-card">
      <span class="example-format">PDF</span>
      <h1>Marly Boutique Hotel</h1>
      <p>Hotel brochure</p>
      <button type="button" data-document="marly">Open Marly brochure</button>
    </article>
    <article class="example-card">
      <span class="example-format">PDF</span>
      <h2>The Leela Palace Trail</h2>
      <p>Hotel collection brochure</p>
      <button type="button" data-document="leela">Open Leela brochure</button>
    </article>
    <article class="example-card">
      <span class="example-format">IMAGE</span>
      <h2>Image annotations</h2>
      <p>Draw and review on a separate layer</p>
      <button type="button" data-document="image">Open image sample</button>
    </article>
    <p id="example-status" role="status"></p>
  </main>
  <script type="module" src="/examples/example.js"></script>
</body>
</html>
